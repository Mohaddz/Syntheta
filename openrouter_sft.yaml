config_version: "0.1"
task: generate
method: topic_tree
domain: "biology"
n: 100
seed: 42

languages: [en, ar]
task_types: [qa, explain]
difficulty: [1, 3]

topic_tree:
  max_depth: 4
  num_samples_per_node: 5
  max_attribute_count: 20

responses:
  enabled: true
  use_cot: false

filters:
  safety:
    enabled: true
  quality:
    enabled: false
  template_collapse:
    enabled: true
    action: report

llm:
  base_url: "https://api.fireworks.ai/inference/v1"
  api_key_env: OPENAI_API_KEY
  model: accounts/fireworks/routers/kimi-k2p5-turbo
  max_concurrent: 50
  max_retries: 5
  timeout: 120

output: python_sft_10.jsonl
checkpoint_path: ./checkpoints
