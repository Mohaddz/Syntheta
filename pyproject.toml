[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntheta"
version = "0.1.0"
description = "Open-source Python SDK and CLI for generating synthetic LLM training datasets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Syntheta Contributors" },
]
keywords = ["synthetic-data", "llm", "machine-learning", "training-data", "dataset-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.30",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
hub = ["datasets>=2.18"]
all = ["syntheta[hub]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
syntheta = "syntheta.cli.main:cli"

[project.urls]
Homepage = "https://github.com/syntheta/syntheta"
Repository = "https://github.com/syntheta/syntheta"
Issues = "https://github.com/syntheta/syntheta/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external API access",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "E741", "B905", "RUF059"]
