config_version: "0.1"
task: generate
method: persona
n: 5000

persona:
  source: "corpus.jsonl"
  max_personas: 500
  expansion_rounds: 6
  dedup_threshold: 0.9

llm:
  embedding_model: "text-embedding-3-small"

responses:
  enabled: true
  use_cot: false

filters:
  safety:
    enabled: true
  quality:
    enabled: true
    min_score: 0.7
